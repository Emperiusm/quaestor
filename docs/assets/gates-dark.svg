<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 267" width="1000" height="267" role="img" aria-labelledby="t d"><title id="t">Three gates</title><desc id="d">Profile ceiling, directive gate and observation gate.</desc><rect x="0.8" y="0.8" width="998.5" height="265.5" rx="14.0" fill="#11161C" stroke="#2E3A47" stroke-width="1.5"/><rect x="24.0" y="24.0" width="306.7" height="219.1" rx="10.0" fill="#182029" stroke="#2E3A47" stroke-width="1.5"/><text x="44.0" y="54.0" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#8AA4FF" text-anchor="start" letter-spacing="0.80">1 · ONCE, AT START</text><text x="44.0" y="82.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Profile ceiling</text><text x="44.0" y="110.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">A READ_ONLY relay pointed at an</text><text x="44.0" y="133.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">agent that can edit files is refused</text><text x="44.0" y="155.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">before the first message moves.</text><rect x="346.7" y="24.0" width="306.7" height="219.1" rx="10.0" fill="#182029" stroke="#2E3A47" stroke-width="1.5"/><text x="366.7" y="54.0" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#8AA4FF" text-anchor="start" letter-spacing="0.80">2 · PER MESSAGE</text><text x="366.7" y="82.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Directive gate</text><text x="366.7" y="110.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">Fenced quaestor-effect requests</text><text x="366.7" y="133.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">run through core.authority.require.</text><text x="366.7" y="155.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">Owner-gated means a hold; an</text><text x="366.7" y="178.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">unmodelled effect class is</text><text x="366.7" y="200.6" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">refused, not ignored.</text><rect x="669.3" y="24.0" width="306.7" height="219.1" rx="10.0" fill="#182029" stroke="#2E3A47" stroke-width="1.5"/><text x="689.3" y="54.0" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#8AA4FF" text-anchor="start" letter-spacing="0.80">3 · AFTER THE FACT</text><text x="689.3" y="82.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Observation gate</text><text x="689.3" y="110.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">Nobody can stop an unconfined</text><text x="689.3" y="133.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">agent from running git push. The</text><text x="689.3" y="155.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">relay refuses to instruct it, detects</text><text x="689.3" y="178.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">that it happened, and stops.</text></svg>
