cSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">session. No duplicates, no re-deliveries.</text><line x1="44.0" y1="485.2" x2="956.0" y2="485.2" stroke="#2E3A47"/><rect x="44.0" y="499.2" width="97.2" height="25.5" rx="12.8" fill="#15352C" stroke="none" stroke-width="0.0"/><text x="55.0" y="516.5" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" font-weight="500" fill="#4CC7A0" text-anchor="start">owner hold</text><text x="234.0" y="516.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">An observed GIT_COMMIT under STANDARD_EDIT halted the relay. HEAD was</text><text x="234.0" y="538.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">unchanged.</text><line x1="44.0" y1="552.2" x2="956.0" y2="552.2" stroke="#2E3A47"/><rect x="44.0" y="566.2" width="112.3" height="25.5" rx="12.8" fill="#3A2A14" stroke="none" stroke-width="0.0"/><text x="55.0" y="583.5" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" font-weight="500" fill="#E9A64E" text-anchor="start">billing path</text><text x="234.0" y="583.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">UNVERIFIED, permanently: a browser session carries no evidence of which plan is paying.</text></svg>
