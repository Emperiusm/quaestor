,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#9AA6B3" text-anchor="start">page’s own message ids</text><rect x="666.7" y="60.0" width="309.3" height="135.2" rx="10.0" fill="#182029" stroke="#2E3A47" stroke-width="1.5"/><text x="686.7" y="110.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="40.0" font-weight="700" fill="#4CC7A0" text-anchor="start">0</text><text x="686.7" y="140.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#9AA6B3" text-anchor="start">stale replies forwarded</text><rect x="24.0" y="207.2" width="309.3" height="135.2" rx="10.0" fill="#182029" stroke="#2E3A47" stroke-width="1.5"/><text x="44.0" y="257.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="40.0" font-weight="700" fill="#4CC7A0" text-anchor="start">0</text><text x="44.0" y="287.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#9AA6B3" text-anchor="start">partial replies forwarded</text><rect x="345.3" y="207.2" width="309.3" height="135.2" rx="10.0" fill="#182029" stroke="#2E3A47" stroke-width="1.5"/><text x="365.3" y="257.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="40.0" font-weight="700" fill="#4CC7A0" text-anchor="start">0</text><text x="365.3" y="287.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#9AA6B3" text-anchor="start">manual copy/paste steps after start</text><rect x="666.7" y="207.2" width="309.3" height="135.2" rx="10.0" fill="#182029" stroke="#2E3A47" stroke-width="1.5"/><text x="686