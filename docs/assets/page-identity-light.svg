<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 394" width="1000" height="394" role="img" aria-labelledby="t d"><title id="t">Reading a chat page reliably</title><desc id="d">Four facts about the ChatGPT page and how the relay handles each.</desc><rect x="0.8" y="0.8" width="998.5" height="392.5" rx="14.0" fill="#F3F5F7" stroke="#CDD4DC" stroke-width="1.5"/><rect x="24.0" y="24.0" width="468.0" height="154.1" rx="10.0" fill="#FFFFFF" stroke="#CDD4DC" stroke-width="1.5"/><path d="M38.0 25.8 H478.0" stroke="#0F7B5F" stroke-width="3.5" stroke-linecap="round"/><text x="44.0" y="54.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="700" fill="#14202B" text-anchor="start">Threads virtualise</text><text x="44.0" y="82.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">ChatGPT renders only the most recent turns: six user</text><text x="44.0" y="105.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">turns rendered as three. A count stops rising, so the</text><text x="44.0" y="127.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">relay finds its own turn and takes the one after it.</text><rect x="508.0" y="24.0" width="468.0" height="154.1" rx="10.0" fill="#FFFFFF" stroke="#CDD4DC" stroke-width="1.5"/><path d="M522.0 25.8 H962.0" stroke="#0F7B5F" stroke-width="3.5" stroke-linecap="round"/><text x="528.0" y="54.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="700" fill="#14202B" text-anchor="start">Markdown eats content keys</text><text x="528.0" y="82.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">innerText drops code-fence backticks. On a 4,339-char</text><text x="528.0" y="105.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">charter the relay’s key was 8857ba87 and the page’s</text><text x="528.0" y="127.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">48c189de, diverging exactly at the fence.</text><rect x="24.0" y="194.1" width="468.0" height="176.6" rx="10.0" fill="#FFFFFF" stroke="#CDD4DC" stroke-width="1.5"/><path d="M38.0 195.9 H478.0" stroke="#2C4FC4" stroke-width="3.5" stroke-linecap="round"/><text x="44.0" y="224.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="700" fill="#14202B" text-anchor="start">So the page’s own ids win</text><text x="44.0" y="252.8" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">Each turn’s data-message-id becomes the relay</text><text x="44.0" y="275.3" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">message id. Without one, an id is minted from</text><text x="44.0" y="297.8" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">conversation, turn index and content key, and</text><text x="44.0" y="320.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">recomputes after a restart.</text><rect x="508.0" y="194.1" width="468.0" height="176.6" rx="10.0" fill="#FFFFFF" stroke="#CDD4DC" stroke-width="1.5"/><path d="M522.0 195.9 H962.0" stroke="#B42C2C" stroke-width="3.5" stroke-linecap="round"/><text x="528.0" y="224.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="19.0" font-weight="700" fill="#14202B" text-anchor="start">Absent from the window ≠ absent</text><text x="528.0" y="252.8" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">holds() navigates to the right conversation first and</text><text x="528.0" y="275.3" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">refuses to answer while it sees only a window.</text><text x="528.0" y="297.8" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">Guessing would re-send an instruction already being</text><text x="528.0" y="320.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">acted on.</text></svg>
