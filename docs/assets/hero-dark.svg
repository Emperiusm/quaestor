<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d"><title id="t">Quaestor</title><desc id="d">ChatGPT thinks. Your coding agent types. Quaestor keeps the ledger.</desc><rect x="0.8" y="0.8" width="998.5" height="378.5" rx="14.0" fill="#11161C" stroke="#2E3A47" stroke-width="1.5"/><text x="36.0" y="58.0" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="13.0" font-weight="500" fill="#9AA6B3" text-anchor="start" letter-spacing="1.20">QUAESTOR  ·  RELAY MODE  ·  LOCAL-FIRST CONTROL PLANE</text><text x="36.0" y="110.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="36.0" font-weight="700" fill="#E4E9EF" text-anchor="start">ChatGPT thinks. Your coding agent types.</text><text x="36.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="36.0" font-weight="700" fill="#8AA4FF" text-anchor="start">Quaestor keeps the ledger.</text><text x="36.0" y="194.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="400" fill="#9AA6B3" text-anchor="start">Quaestor runs a conversation between an Orchestrator (a ChatGPT conversation in your own browser,</text><text x="36.0" y="220.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="400" fill="#9AA6B3" text-anchor="start">or any OpenAI-compatible model) and an Execution Agent (an OpenCode session) until the work is done.</text><text x="36.0" y="246.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="400" fill="#9AA6B3" text-anchor="start">In between, it reads the repository with its own git, refuses effects nobody authorized, and never takes</text><text x="36.0" y="272.3" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="400" fill="#9AA6B3" text-anchor="start">“I’m done” on faith.</text><rect x="36.0" y="312.4" width="236.4" height="34.0" rx="17.0" fill="#15352C" stroke="#4CC7A0" stroke-width="1.2"/><circle cx="55.0" cy="329.4" r="5" fill="#4CC7A0"/><text x="68.0" y="334.4" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#E4E9EF" text-anchor="start">Orchestrator · ChatGPT Web</text><rect x="284.4" y="312.4" width="269.7" height="34.0" rx="17.0" fill="#1D2848" stroke="#8AA4FF" stroke-width="1.2"/><circle cx="303.4" cy="329.4" r="5" fill="#8AA4FF"/><text x="316.4" y="334.4" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#E4E9EF" text-anchor="start">Relay kernel · src/quaestor/relay/</text><rect x="566.1" y="312.4" width="236.5" height="34.0" rx="17.0" fill="#3A2A14" stroke="#E9A64E" stroke-width="1.2"/><circle cx="585.1" cy="329.4" r="5" fill="#E9A64E"/><text x="598.1" y="334.4" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="500" fill="#E4E9EF" text-anchor="start">Execution Agent · OpenCode</text></svg>
