<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 422" width="1000" height="422" role="img" aria-labelledby="t d"><title id="t">Two product modes</title><desc id="d">Relay Mode and Program Mode, two products on one shared core.</desc><rect x="0.8" y="0.8" width="998.5" height="420.5" rx="14.0" fill="#11161C" stroke="#2E3A47" stroke-width="1.5"/><rect x="24.0" y="24.0" width="464.0" height="241.6" rx="10.0" fill="#182029" stroke="#2E3A47" stroke-width="1.5"/><text x="44.0" y="56.0" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14.0" font-weight="500" fill="#8AA4FF" text-anchor="start">quaestor relay</text><text x="44.0" y="88.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="21.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Relay Mode — conversation-first</text><text x="44.0" y="118.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">An Orchestrator endpoint and an Execution Agent</text><text x="44.0" y="140.5" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">endpoint talk turn after turn, joined by a kernel with no</text><text x="44.0" y="162.9" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">provider code. Ordinary engineering prose, no directive</text><text x="44.0" y="185.4" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">schema.</text><text x="44.0" y="213.9" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="500" fill="#9AA6B3" text-anchor="start" letter-spacing="0.80">CHATGPT’S ROLE</text><text x="44.0" y="235.9" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.0" font-weight="400" fill="#E4E9EF" text-anchor="start">ChatGPT directs the agent through a whole slice.</text><line x1="256.0" y1="265.6" x2="256.0" y2="291.6" stroke="#8AA4FF" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="512.0" y="24.0" width="464.0" height="241.6" rx="10.0" fill="#182029" stroke="#2E3A47" stroke-width="1.5"/><text x="532.0" y="56.0" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14.0" font-weight="500" fill="#8AA4FF" text-anchor="start">quaestor program</text><text x="532.0" y="88.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="21.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Program Mode — state machine</text><text x="532.0" y="118.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">Programs, workflows, lanes, runs, seats, worktrees,</text><text x="532.0" y="140.5" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">leases and independent reviewers. A role says what an</text><text x="532.0" y="162.9" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">actor is for; it never grants authority.</text><text x="532.0" y="191.4" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="500" fill="#9AA6B3" text-anchor="start" letter-spacing="0.80">CHATGPT’S ROLE</text><text x="532.0" y="213.4" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.0" font-weight="400" fill="#E4E9EF" text-anchor="start">ChatGPT holds a read-only strategist seat, one packet at</text><text x="532.0" y="235.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.0" font-weight="400" fill="#E4E9EF" text-anchor="start">a time.</text><line x1="744.0" y1="265.6" x2="744.0" y2="291.6" stroke="#8AA4FF" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="24.0" y="291.6" width="952.0" height="106.9" rx="10.0" fill="#1D2848" stroke="#8AA4FF" stroke-width="1.5"/><text x="44.0" y="321.6" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.0" font-weight="600" fill="#8AA4FF" text-anchor="start" letter-spacing="0.80">SHARED CORE  ·  core/ imports nothing above it</text><text x="44.0" y="347.6" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#E4E9EF" text-anchor="start">authority · owner channel · classification and redaction · independent repository observation · evidence · durable</text><text x="44.0" y="370.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#E4E9EF" text-anchor="start">decisions</text></svg>
