<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 337" width="1000" height="337" role="img" aria-labelledby="t d"><title id="t">Surviving a crash</title><desc id="d">How each in-flight delivery is reconciled.</desc><rect x="0.8" y="0.8" width="998.5" height="335.5" rx="14.0" fill="#F3F5F7" stroke="#CDD4DC" stroke-width="1.5"/><rect x="24.0" y="24.0" width="952.0" height="289.9" rx="10.0" fill="#FFFFFF" stroke="#CDD4DC" stroke-width="1.5"/><text x="44.0" y="58.0" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.0" font-weight="600" fill="#56626F" text-anchor="start" letter-spacing="0.80">ON RESUME, FOR EVERY DELIVERY THAT WAS IN FLIGHT</text><rect x="44.0" y="86.0" width="112.3" height="25.5" rx="12.8" fill="#DDF0E9" stroke="none" stroke-width="0.0"/><text x="55.0" y="103.2" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" font-weight="500" fill="#0F7B5F" text-anchor="start">already held</text><text x="234.0" y="103.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">The endpoint confirms it holds the relay-assigned id. Confirmed, never re-sent.</text><line x1="44.0" y1="120.0" x2="956.0" y2="120.0" stroke="#CDD4DC"/><rect x="44.0" y="134.0" width="82.2" height="25.5" rx="12.8" fill="#F7EAD6" stroke="none" stroke-width="0.0"/><text x="55.0" y="151.2" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" font-weight="500" fill="#A8620B" text-anchor="start">not held</text><text x="234.0" y="151.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">Re-sent exactly once.</text><line x1="44.0" y1="168.0" x2="956.0" y2="168.0" stroke="#CDD4DC"/><rect x="44.0" y="182.0" width="119.8" height="25.5" rx="12.8" fill="#F8E1E1" stroke="none" stroke-width="0.0"/><text x="55.0" y="199.2" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" font-weight="500" fill="#B42C2C" text-anchor="start">cannot answer</text><text x="234.0" y="199.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">Stops with UNRECONCILABLE_DELIVERY and a human decides. A transport error is never</text><text x="234.0" y="221.5" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">read as “no”.</text><line x1="44.0" y1="234.9" x2="956.0" y2="234.9" stroke="#CDD4DC"/><rect x="44.0" y="248.9" width="142.4" height="25.5" rx="12.8" fill="#E1E7FA" stroke="none" stroke-width="0.0"/><text x="55.0" y="266.2" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12.5" font-weight="500" fill="#2C4FC4" text-anchor="start">outstanding turn</text><text x="234.0" y="265.9" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">Collected, not re-issued: the persisted anchor is picked back up and the reply the endpoint</text><text x="234.0" y="288.4" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#56626F" text-anchor="start">has been holding is read.</text></svg>
