<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1265" width="1000" height="1265" role="img" aria-labelledby="t d"><title id="t">One relay exchange</title><desc id="d">Ten steps from signing in to a measured completion; steps 3 to 9 repeat on every exchange.</desc><rect x="0.8" y="0.8" width="998.5" height="1263.5" rx="14.0" fill="#11161C" stroke="#2E3A47" stroke-width="1.5"/><circle cx="42.0" cy="49.0" r="6" fill="#9AA6B3"/><text x="54.0" y="54.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14.0" font-weight="400" fill="#E4E9EF" text-anchor="start">you</text><circle cx="112.7" cy="49.0" r="6" fill="#4CC7A0"/><text x="124.7" y="54.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14.0" font-weight="400" fill="#E4E9EF" text-anchor="start">chatgpt-web end</text><circle cx="267.1" cy="49.0" r="6" fill="#8AA4FF"/><text x="279.1" y="54.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14.0" font-weight="400" fill="#E4E9EF" text-anchor="start">relay kernel</text><circle cx="389.3" cy="49.0" r="6" fill="#E9A64E"/><text x="401.3" y="54.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14.0" font-weight="400" fill="#E4E9EF" text-anchor="start">opencode end</text><line x1="58.0" y1="120.0" x2="58.0" y2="206.3" stroke="#2E3A47" stroke-width="1.5"/><circle cx="58.0" cy="102.0" r="17" fill="#182029" stroke="#9AA6B3" stroke-width="2"/><text x="58.0" y="107.5" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15.0" font-weight="700" fill="#9AA6B3" text-anchor="middle">1</text><text x="100.0" y="92.0" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#9AA6B3" text-anchor="start" letter-spacing="0.80">YOU · ONCE</text><text x="100.0" y="116.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Start a browser Quaestor can attach to, and sign in</text><text x="100.0" y="143.4" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">Chrome with --remote-debugging-port=9222 and a profile kept for this purpose. Quaestor never launches</text><text x="100.0" y="165.9" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">it, never sees the password, never closes it.</text><line x1="58.0" y1="238.3" x2="58.0" y2="324.7" stroke="#2E3A47" stroke-width="1.5"/><circle cx="58.0" cy="220.3" r="17" fill="#182029" stroke="#4CC7A0" stroke-width="2"/><text x="58.0" y="225.8" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15.0" font-weight="700" fill="#4CC7A0" text-anchor="middle">2</text><text x="100.0" y="210.3" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#4CC7A0" text-anchor="start" letter-spacing="0.80">CHATGPT-WEB END · ATTACH</text><text x="100.0" y="234.3" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Find the right tab over the DevTools endpoint</text><text x="100.0" y="261.8" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">GET :9222/json, keep page targets, prefer the ChatGPT URL, and open its WebSocket with a stdlib client,</text><text x="100.0" y="284.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">or Playwright’s connect_over_cdp.</text><line x1="58.0" y1="356.7" x2="58.0" y2="443.0" stroke="#2E3A47" stroke-width="1.5"/><circle cx="58.0" cy="338.7" r="17" fill="#182029" stroke="#8AA4FF" stroke-width="2"/><text x="58.0" y="344.2" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15.0" font-weight="700" fill="#8AA4FF" text-anchor="middle">3</text><text x="100.0" y="328.7" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#8AA4FF" text-anchor="start" letter-spacing="0.80">KERNEL · BUILD THE PACKET</text><text x="100.0" y="352.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Tell ChatGPT what the agent said, and what the repo shows</text><text x="100.0" y="380.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">The agent’s words verbatim up to a cap, plus a repository line from the relay’s own git. Secrets and host</text><text x="100.0" y="402.6" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">paths are redacted in both directions.</text><line x1="58.0" y1="475.0" x2="58.0" y2="561.4" stroke="#2E3A47" stroke-width="1.5"/><circle cx="58.0" cy="457.0" r="17" fill="#182029" stroke="#8AA4FF" stroke-width="2"/><text x="58.0" y="462.5" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15.0" font-weight="700" fill="#8AA4FF" text-anchor="middle">4</text><text x="100.0" y="447.0" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#8AA4FF" text-anchor="start" letter-spacing="0.80">KERNEL · RECORD FIRST</text><text x="100.0" y="471.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Write DELIVERING before sending anything</text><text x="100.0" y="498.4" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">Written and fsynced before the submit, so a crash between send and acknowledgement leaves evidence</text><text x="100.0" y="520.9" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">that a send may have happened.</text><line x1="58.0" y1="593.4" x2="58.0" y2="679.8" stroke="#2E3A47" stroke-width="1.5"/><circle cx="58.0" cy="575.4" r="17" fill="#182029" stroke="#4CC7A0" stroke-width="2"/><text x="58.0" y="580.9" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15.0" font-weight="700" fill="#4CC7A0" text-anchor="middle">5</text><text x="100.0" y="565.4" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#4CC7A0" text-anchor="start" letter-spacing="0.80">CHATGPT-WEB END · SEND()</text><text x="100.0" y="589.4" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Note what’s on screen, then type and submit</text><text x="100.0" y="616.8" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">Records the last data-message-id as the anchor, fills the composer and clicks Send via Runtime.evaluate,</text><text x="100.0" y="639.3" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">then waits for its own new user-turn id.</text><line x1="58.0" y1="711.8" x2="58.0" y2="798.1" stroke="#2E3A47" stroke-width="1.5"/><circle cx="58.0" cy="693.8" r="17" fill="#182029" stroke="#4CC7A0" stroke-width="2"/><text x="58.0" y="699.2" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15.0" font-weight="700" fill="#4CC7A0" text-anchor="middle">6</text><text x="100.0" y="683.8" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#4CC7A0" text-anchor="start" letter-spacing="0.80">CHATGPT-WEB END · RECEIVE()</text><text x="100.0" y="707.8" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Take the reply to our turn, once it has really finished</text><text x="100.0" y="735.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">Same conversation, or END_WORKSPACE_MISMATCH. Stop button gone, text stable. A partial reply is</text><text x="100.0" y="757.6" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">never forwarded.</text><line x1="58.0" y1="830.1" x2="58.0" y2="916.5" stroke="#2E3A47" stroke-width="1.5"/><circle cx="58.0" cy="812.1" r="17" fill="#182029" stroke="#8AA4FF" stroke-width="2"/><text x="58.0" y="817.6" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15.0" font-weight="700" fill="#8AA4FF" text-anchor="middle">7</text><text x="100.0" y="802.1" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#8AA4FF" text-anchor="start" letter-spacing="0.80">KERNEL · DIRECTIVE GATE</text><text x="100.0" y="826.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Check the reply for requested effects</text><text x="100.0" y="853.5" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">Anything beyond editing files needs a quaestor-effect block, and an owner-gated one becomes an</text><text x="100.0" y="876.0" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">OWNER_HOLD: recorded, never delivered.</text><line x1="58.0" y1="948.5" x2="58.0" y2="1012.3" stroke="#2E3A47" stroke-width="1.5"/><circle cx="58.0" cy="930.5" r="17" fill="#182029" stroke="#E9A64E" stroke-width="2"/><text x="58.0" y="936.0" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15.0" font-weight="700" fill="#E9A64E" text-anchor="middle">8</text><text x="100.0" y="920.5" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#E9A64E" text-anchor="start" letter-spacing="0.80">OPENCODE END · DELIVER</text><text x="100.0" y="944.5" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Hand the instruction to the agent verbatim</text><text x="100.0" y="971.9" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">prompt_async with a caller-supplied message id, so the agent keeps working even if the relay dies.</text><line x1="58.0" y1="1044.3" x2="58.0" y2="1130.7" stroke="#2E3A47" stroke-width="1.5"/><circle cx="58.0" cy="1026.3" r="17" fill="#182029" stroke="#8AA4FF" stroke-width="2"/><text x="58.0" y="1031.8" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15.0" font-weight="700" fill="#8AA4FF" text-anchor="middle">9</text><text x="100.0" y="1016.3" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#8AA4FF" text-anchor="start" letter-spacing="0.80">KERNEL · OBSERVE</text><text x="100.0" y="1040.3" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="700" fill="#E4E9EF" text-anchor="start">Read the repository again, independently</text><text x="100.0" y="1067.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">If the difference implies a capability the profile lacks, such as a commit under STANDARD_EDIT, the</text><text x="100.0" y="1090.2" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">relay holds. Otherwise the loop returns to step 3.</text><circle cx="58.0" cy="1144.7" r="17" fill="#182029" stroke="#8AA4FF" stroke-width="2"/><text x="58.0" y="1150.2" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15.0" font-weight="700" fill="#8AA4FF" text-anchor="middle">10</text><text x="100.0" y="1134.7" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11.5" font-weight="600" fill="#8AA4FF" text-anchor="start" letter-spacing="0.80">KERNEL · COMPLETION</text><text x="100.0" y="1158.7" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="18.0" font-weight="700" fill="#E4E9EF" text-anchor="start">“Done” is a claim, and it gets measured</text><text x="100.0" y="1186.1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">RELAY-OBJECTIVE-COMPLETE as the last line makes the relay run every --verify command itself</text><text x="100.0" y="1208.5" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="15.5" font-weight="400" fill="#9AA6B3" text-anchor="start">before it believes the claim.</text><path d="M934.0 1026.3 H952.0 V338.7 H934.0" fill="none" stroke="#8AA4FF" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M930.0 338.7 l9 -5 v10 z" fill="#8AA4FF"/><text x="968.0" y="682.5" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="12" font-weight="600" fill="#8AA4FF" text-anchor="middle" letter-spacing="0.8" transform="rotate(-90 968.0 682.5)">EVERY EXCHANGE</text></svg>
